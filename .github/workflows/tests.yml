name: tests

# Runs the structural unit tests and a full import check of the simulation
# modules. This is intentionally NOT the physics validation: reproducing the
# manuscript exponents needs the production campaigns (see docs/REPRODUCE.md)
# and takes hours, which is not appropriate for CI.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Byte-compile every module
        # Catches syntax errors and stale imports without paying the numba JIT
        # cost of actually importing the kernels.
        run: python -m compileall -q code tests

      - name: Run unit tests
        run: python -m pytest tests -q
